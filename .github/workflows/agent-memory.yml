name: Jarvis agent memory
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  local-memory:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Memory persistence, retrieval, MCP and HTTP
        run: python -m unittest discover -s tests_agent -v
      - name: Existing memory compatibility
        run: python -m unittest discover -s tests -v

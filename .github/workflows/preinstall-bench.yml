name: Jarvis pre-installation bench
on:
  workflow_dispatch:
  push:
    paths:
      - 'bojart_ops/**'
      - 'bojart_memory/**'
      - 'tools/**'
      - 'jarvis/**'
      - 'tests/**'
      - 'tests_agent/**'
      - 'tests_ops/**'
      - 'tests_workflows/**'
      - 'data/preinstallation/**'
      - '*.cmd'
      - '.github/workflows/preinstall-bench.yml'
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  LANGSMITH_TRACING: 'false'
jobs:
  bench:
    # Software simulation only: no microphone, physical monitor, printer, model or paid service.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the runtime (Windows - the hashed lock, exactly as the tower)
        shell: bash
        run: |
          lock=jarvis/locks/windows-cp312-moteurs.txt
          if [ "$RUNNER_OS" = "Windows" ] && [ -f "$lock" ]; then
            python -m pip install --require-hashes --no-deps -r "$lock"
            python -m pip check
          else
            python -m pip install -r jarvis/requirements.txt
          fi
          python -m pip install pytest==9.0.2
      - name: Bench and lock contracts
        shell: bash
        run: |
          python -m unittest discover -s tests_ops -p test_banc_simulation.py -v
          python -m unittest discover -s tests_ops -p test_verrou_dependances.py -v
          python -m unittest discover -s tests_ops -p test_installation_tout.py -v
          python -m unittest discover -s tests_ops -p test_collecte.py -v
      - name: Run every simulated Jarvis action
        run: python tools/banc_preinstallation.py --reseau --output .bojart-audit/banc.json --markdown .bojart-audit/banc.md
      - name: Install the Windows voice lock on top, then check the environment
        if: runner.os == 'Windows' && hashFiles('jarvis/locks/windows-cp312-voice.txt') != ''
        shell: bash
        run: |
          python -m pip install --require-hashes --no-deps -r jarvis/locks/windows-cp312-voice.txt
          python -m pip check
          python -c "import faster_whisper, ctranslate2; print('voix importable')"
      - name: Resolve today's lock on this platform (nothing installed)
        if: always()
        run: python tools/verrouiller_dependances.py --sortie .bojart-audit/verrous --comparer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preinstall-bench-${{ matrix.os }}
          path: |
            .bojart-audit/banc.json
            .bojart-audit/banc.md
            .bojart-audit/verrous/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

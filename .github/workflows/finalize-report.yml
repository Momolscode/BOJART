name: Publish verified backup report
on:
  push:
    branches: ['archive/bilan-verification-sauvegarde-2026-11-01']
    paths: ['.transfer/**', '.github/workflows/finalize-report.yml']
permissions:
  contents: write
concurrency:
  group: publish-bojart-backup-report-2026-11-01
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'Momolscode/BOJART' && github.ref == 'refs/heads/archive/bilan-verification-sauvegarde-2026-11-01'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract exact original report
        run: python3 tools/finalize_report.py
      - name: Publish report files and remove transfer staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- BOJART_VERIFICATION_SAUVEGARDE_2026-11-01.zip BILAN_VERIFICATION.md comparison.json remote_selected_evidence.json audit.py INTEGRITY.json
          git rm -- .transfer/report.zip.part00 .transfer/report.zip.part01 .transfer/report.zip.part02 .transfer/report.zip.part03 .transfer/report.zip.part04 .transfer/report.zip.part05 .github/workflows/finalize-report.yml
          git commit -m 'docs: finalize checksum-verified backup report and annexes'
          git push origin HEAD:refs/heads/archive/bilan-verification-sauvegarde-2026-11-01

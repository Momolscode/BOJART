name: BOJART data audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bojart-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test audit and recovery invariants
        run: python -m unittest discover -s tests_ops -v
      - name: Inventory and inspect tracked files
        if: always()
        run: python tools/audit_repository.py --output .bojart-audit
      - name: Read contextual checkpoint without changing the audited checkout
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Momolscode/BOJART
          ref: audit/context-results
          path: .bojart-audit/context-source
          sparse-checkout: ops/context-monitor/checkpoint.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Classify sources and prepare review batches
        if: always()
        run: python tools/orchestrate.py --audit .bojart-audit/audit.json --checkpoint .bojart-audit/context-source/ops/context-monitor/checkpoint.json
      - name: Add audit summary
        if: always()
        run: |
          if test -f .bojart-audit/audit.md; then
            cat .bojart-audit/audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f .bojart-audit/orchestration.md; then
            cat .bojart-audit/orchestration.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bojart-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .bojart-audit/audit.json
            .bojart-audit/audit.md
            .bojart-audit/orchestration.json
            .bojart-audit/orchestration.md
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

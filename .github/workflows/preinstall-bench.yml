name: Jarvis pre-installation bench
on:
  workflow_dispatch:
  push:
    paths:
      - 'bojart_ops/**'
      - 'bojart_memory/**'
      - 'tools/**'
      - 'jarvis/**'
      - 'tests/**'
      - 'tests_agent/**'
      - 'tests_ops/**'
      - 'tests_workflows/**'
      - 'data/preinstallation/**'
      - '*.cmd'
      - '.github/workflows/preinstall-bench.yml'
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  LANGSMITH_TRACING: 'false'
jobs:
  bench:
    # Software simulation only: no microphone, physical monitor, printer, model or paid service.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the repository-pinned runtime (LangGraph and CAD)
        run: python -m pip install -r jarvis/requirements.txt pytest==9.0.2
      - name: Bench contracts
        run: python -m unittest discover -s tests_ops -p test_banc_simulation.py -v
      - name: Run every simulated Jarvis action
        run: python tools/banc_preinstallation.py --reseau --output .bojart-audit/banc.json --markdown .bojart-audit/banc.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preinstall-bench-${{ matrix.os }}
          path: |
            .bojart-audit/banc.json
            .bojart-audit/banc.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

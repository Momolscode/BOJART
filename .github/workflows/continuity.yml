name: BOJART continuity
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: bojart-continuity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source policy and provenance
        run: python tools/validate_repository.py
      - name: Memory and HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Cited retrieval regression cases
        run: python tools/evaluate_memory.py
      - name: Real launcher, restart and restore in temporary state
        run: python tools/check_startup.py --output .bojart-audit/startup.json
      - name: Signal and memory context tests
        run: node --test jarvis/tests/voice_endpoint.test.cjs jarvis/tests/memory_context.test.cjs
      - name: JavaScript syntax
        run: node --check jarvis/apps/jarvis/app/memory.js

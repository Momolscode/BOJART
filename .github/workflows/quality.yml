name: BOJART quality schema
on:
  push:
    paths:
      - 'tools/quality_gate.py'
      - 'configs/quality_gates.json'
      - 'reviews/example.json'
      - '.github/workflows/quality.yml'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate configuration and expected rejection of pending example
        run: |
          python -m json.tool configs/quality_gates.json > /dev/null
          python -m json.tool reviews/example.json > /dev/null
          if python tools/quality_gate.py reviews/example.json; then
            echo "Pending review was incorrectly approved" >&2
            exit 1
          fi
          echo "Pending review correctly blocked."

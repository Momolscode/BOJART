name: Verify archived Higgsfield videos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-higgsfield-exports.yml'
permissions:
  contents: read
jobs:
  verify-video-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify completed video exports
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.parse, urllib.request
          root = pathlib.Path("runs/higgsfield")
          target = pathlib.Path("verified-exports")
          target.mkdir(exist_ok=True)
          results = []
          for folder in ["painted-reality-01", "the-awakening-01"]:
              record = json.loads((root/folder/"status.json").read_text())
              if record.get("status") != "completed":
                  raise ValueError("Generation not completed")
              url = record["result_url"]
              address = urllib.parse.urlsplit(url)
              if address.scheme != "https" or address.hostname != "d8j0ntlcm91z4.cloudfront.net":
                  raise ValueError("Unexpected source host")
              request = urllib.request.Request(url, headers={"User-Agent":"BOJART-verification/1.0"})
              with urllib.request.urlopen(request, timeout=120) as response:
                  if response.status != 200: raise ValueError("Download failed")
                  payload = response.read(150000000)
              if len(payload) < 1024 or payload[4:8] != b"ftyp":
                  raise ValueError("Invalid mp4 file")
              path = target / (folder + ".mp4")
              path.write_bytes(payload)
              results.append({"id":folder, "bytes":len(payload),"sha256":hashlib.sha256(payload).hexdigest()})
          (target/"MANIFEST.json").write_text(json.dumps(results,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bojart-higgsfield-verified-mp4
          path: verified-exports/
          retention-days: 30
